# DAOS Zeus Shared Memory GPT Action — exact additive NPM locations.
# This file is included inside NPM proxy server blocks. Exact lowercase AX routes
# win; every subpath, trailing slash, mixed-case lookalike, and non-AX host fails closed.

location ^~ /zeus-memory/ {
    return 404;
}
location ~* ^/zeus-memory {
    return 404;
}

location = /zeus-memory/openapi.yaml {
    if ($host != "ax.dominof.com") { return 404; }
    if ($request_method != GET) { return 405; }
    client_max_body_size 1k;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    proxy_pass http://172.18.0.1:8793;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# Dedicated DAOS Shared Memory GPT Action vhost.
# Installed as /data/nginx/custom/http.conf inside Nginx Proxy Manager.

server {
    listen 80;
    listen [::]:80;
    server_name memory.dominof.com;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name memory.dominof.com;

    http2 on;

    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/npm-memory/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-memory/privkey.pem;

    include conf.d/include/block-exploits.conf;

    access_log /data/logs/memory-action_access.log proxy;
    error_log /data/logs/memory-action_error.log warn;

    include /data/nginx/custom/zeus_memory_locations_memory[.]conf;

    location / { return 404; }
}
